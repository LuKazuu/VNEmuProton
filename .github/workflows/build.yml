name: Build

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'What to build. "wine" = full build (always pulls in fexcore + box64). "fexcore" / "box64" build only that component.'
        type: choice
        options:
          - wine
          - fexcore
          - box64
        required: true
        default: 'wine'
      fexcore_ref:
        description: 'FEX-Emu/FEX git ref. Default: main'
        type: string
        default: 'main'
      box64_ref:
        description: 'ptitSeb/box64 git ref. Default: main'
        type: string
        default: 'main'
      enable_gstreamer:
        description: 'GStreamer (codecs) — wine only'
        type: boolean
        default: true
      enable_ffmpeg:
        description: 'FFmpeg (codecs) — wine only'
        type: boolean
        default: true
      enable_translations:
        description: 'gettext/NLS translations (wine UI language follows LC_ALL). Off = smaller English-only build'
        type: boolean
        default: true
      upload_release:
        description: 'Upload to GitHub Releases'
        type: boolean
        default: true

jobs:
  # ---------------------------------------------------------------------------
  # fexcore: libarm64ecfex.dll + libwow64fex.dll
  # Builds the FEX-Emu FEX DLLs that provide the wow64 emulation layer.
  # Same as VNEmuWine's fexcore build — these DLLs are drop-in compatible.
  # ---------------------------------------------------------------------------
  build-fexcore:
    if: github.event.inputs.component == 'wine' || github.event.inputs.component == 'fexcore'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (this repo — needed for patches/fexcore)
        uses: actions/checkout@v4

      - name: Checkout FEX-Emu/FEX
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.fexcore_ref || 'main' }}" https://github.com/FEX-Emu/FEX.git fex
          cd fex
          git submodule update --init --depth 1 External/xxhash External/zydis External/fmt Source/Common/cpp-optparse External/drm-headers External/range-v3 External/rpmalloc External/unordered_dense External/jemalloc_glibc External/Vulkan-Headers
          cd External/zydis && git submodule update --init --depth 1 dependencies/zycore

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build python3

      - name: Download bylaws-llvm-mingw
        run: |
          wget -q "https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz" -O /tmp/bylaws.tar.xz
          mkdir -p /opt/bylaws-llvm-mingw && tar -xf /tmp/bylaws.tar.xz -C /opt/bylaws-llvm-mingw --strip-components=1

      - name: Verify fexcore patches (patches/fexcore/*.patch)
        run: |
          set -e
          if ls patches/fexcore/*.patch >/dev/null 2>&1; then
            echo "Found fexcore patches, dry-running verification..."
            FAILED=0; PASSED=0
            for patch in patches/fexcore/*.patch; do
              if patch --dry-run -p1 -F0 --no-backup-if-mismatch -d fex < "$patch" >/tmp/p.log 2>&1; then
                echo "  OK    $(basename "$patch")"; PASSED=$((PASSED+1))
              else
                echo "  FAIL  $(basename "$patch")"; cat /tmp/p.log | sed 's/^/        /'; FAILED=$((FAILED+1))
              fi
            done
            echo "$PASSED passed, $FAILED failed"
            if [ "$FAILED" -ne 0 ]; then exit 1; fi
          else
            echo "patches/fexcore is empty (or has no *.patch) — building upstream FEX as-is."
          fi

      - name: Apply fexcore patches
        run: |
          set -e
          if ls patches/fexcore/*.patch >/dev/null 2>&1; then
            for patch in patches/fexcore/*.patch; do
              echo "Applying $(basename "$patch")..."
              patch -p1 -F0 --no-backup-if-mismatch -d fex < "$patch"
            done
          else
            echo "No fexcore patches to apply."
          fi

      - name: Build libarm64ecfex.dll
        run: |
          export PATH="/opt/bylaws-llvm-mingw/bin:$PATH"
          cd fex && mkdir -p build_ec && cd build_ec
          CXXFLAGS="-Wno-deprecated-enum-enum-conversion" \
          cmake -G Ninja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
            -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
            -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            -DTUNE_ARCH=generic -DTUNE_CPU=generic \
            ..
          ninja -j $(nproc) arm64ecfex

      - name: Build libwow64fex.dll
        run: |
          export PATH="/opt/bylaws-llvm-mingw/bin:$PATH"
          cd fex && mkdir -p build_pe && cd build_pe
          CXXFLAGS="-Wno-deprecated-enum-enum-conversion" \
          cmake -G Ninja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
            -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            -DTUNE_ARCH=generic -DTUNE_CPU=generic \
            ..
          ninja -j $(nproc) wow64fex

      - name: Collect fexcore DLLs
        run: |
          mkdir -p fexcore-dlls
          cp fex/build_ec/Bin/libarm64ecfex.dll fexcore-dlls/
          cp fex/build_pe/Bin/libwow64fex.dll fexcore-dlls/
          ls -lh fexcore-dlls/

      - name: Strip fexcore DLLs
        run: |
          for dll in fexcore-dlls/*.dll; do
            /opt/bylaws-llvm-mingw/bin/llvm-strip --strip-debug "$dll"
          done
          ls -lh fexcore-dlls/

      - name: Upload fexcore DLLs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fexcore-dlls
          path: fexcore-dlls/
          retention-days: 1

      - name: Release fexcore DLLs
        if: github.event.inputs.upload_release == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fexcore-dlls-r${{ github.run_number }}"
          {
            echo "fexcore DLLs (FEX ref: \`${{ github.event.inputs.fexcore_ref }}\`)"
            echo
            echo "- \`libarm64ecfex.dll\`"
            echo "- \`libwow64fex.dll\`"
          } > /tmp/notes.md
          gh release create "$TAG" --title "fexcore DLLs r${{ github.run_number }}" --notes-file /tmp/notes.md --repo "${{ github.repository }}" || true
          for dll in fexcore-dlls/*.dll; do [ -f "$dll" ] && gh release upload "$TAG" "$dll" --repo "${{ github.repository }}" --clobber; done

  # ---------------------------------------------------------------------------
  # box64: wowbox64.dll
  # Builds the box64 wow64 emulation DLL.
  # Same as VNEmuWine's box64 build.
  # ---------------------------------------------------------------------------
  build-box64:
    if: github.event.inputs.component == 'wine' || github.event.inputs.component == 'box64'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (this repo — needed for patches/wowbox)
        uses: actions/checkout@v4

      - name: Checkout ptitSeb/box64
        run: git clone --depth 1 --branch "${{ github.event.inputs.box64_ref || 'main' }}" https://github.com/ptitSeb/box64.git box64

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build python3

      - name: Download mstorsjo-llvm-mingw
        run: |
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/20250319/llvm-mingw-20250319-ucrt-ubuntu-20.04-x86_64.tar.xz" -O /tmp/mstorsjo.tar.xz
          mkdir -p /opt/mstorsjo-llvm-mingw && tar -xf /tmp/mstorsjo.tar.xz -C /opt/mstorsjo-llvm-mingw --strip-components=1

      - name: Verify box64 patches (patches/wowbox/*.patch)
        run: |
          set -e
          if ls patches/wowbox/*.patch >/dev/null 2>&1; then
            echo "Found box64 patches, dry-running verification..."
            FAILED=0; PASSED=0
            for patch in patches/wowbox/*.patch; do
              if patch --dry-run -p1 -F0 --no-backup-if-mismatch -d box64 < "$patch" >/tmp/p.log 2>&1; then
                echo "  OK    $(basename "$patch")"; PASSED=$((PASSED+1))
              else
                echo "  FAIL  $(basename "$patch")"; cat /tmp/p.log | sed 's/^/        /'; FAILED=$((FAILED+1))
              fi
            done
            echo "$PASSED passed, $FAILED failed"
            if [ "$FAILED" -ne 0 ]; then exit 1; fi
          else
            echo "patches/wowbox is empty (or has no *.patch) — building upstream box64 as-is."
          fi

      - name: Apply box64 patches
        run: |
          set -e
          if ls patches/wowbox/*.patch >/dev/null 2>&1; then
            for patch in patches/wowbox/*.patch; do
              echo "Applying $(basename "$patch")..."
              patch -p1 -F0 --no-backup-if-mismatch -d box64 < "$patch"
            done
          else
            echo "No box64 patches to apply."
          fi

      - name: Build wowbox64.dll
        run: |
          export PATH="/opt/mstorsjo-llvm-mingw/bin:$PATH"
          cd box64 && mkdir -p build_pe && cd build_pe
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DARM_DYNAREC=ON -DWOW64=ON ..
          cmake --build . --target wowbox64 -j $(nproc)

      - name: Collect box64 DLL
        run: |
          mkdir -p box64-dlls
          find box64/build_pe -name "wowbox64.dll" -exec cp {} box64-dlls/ \;
          ls -lh box64-dlls/

      - name: Strip box64 DLL
        run: |
          for dll in box64-dlls/*.dll; do
            /opt/mstorsjo-llvm-mingw/bin/llvm-strip --strip-debug "$dll"
          done
          ls -lh box64-dlls/

      - name: Upload box64 DLL (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: box64-dlls
          path: box64-dlls/
          retention-days: 1

      - name: Release box64 DLL
        if: github.event.inputs.upload_release == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="box64-dlls-r${{ github.run_number }}"
          {
            echo "box64 DLL (box64 ref: \`${{ github.event.inputs.box64_ref }}\`)"
            echo
            echo "- \`wowbox64.dll\`"
          } > /tmp/notes.md
          gh release create "$TAG" --title "box64 DLL r${{ github.run_number }}" --notes-file /tmp/notes.md --repo "${{ github.repository }}" || true
          for dll in box64-dlls/*.dll; do [ -f "$dll" ] && gh release upload "$TAG" "$dll" --repo "${{ github.repository }}" --clobber; done

  # ---------------------------------------------------------------------------
  # Wine (full VNEmuProton .deb) — depends on fexcore + box64
  # Builds Valve Proton 11.0 (proton_11.0 branch) for Termux/aarch64.
  # The output is a proton-termux_11.0_aarch64.deb (same package name as
  # VNEmuWine for drop-in compatibility).
  # ---------------------------------------------------------------------------
  build-wine:
    needs: [build-fexcore, build-box64]
    if: github.event.inputs.component == 'wine'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fexcore DLLs
        uses: actions/download-artifact@v4
        with:
          name: fexcore-dlls
          path: fexcore-dlls

      - name: Download box64 DLL
        uses: actions/download-artifact@v4
        with:
          name: box64-dlls
          path: box64-dlls

      - name: Merge DLLs into fexcore-dlls/
        run: |
          mkdir -p fexcore-dlls
          cp box64-dlls/*.dll fexcore-dlls/ 2>/dev/null || true
          ls -lh fexcore-dlls/

      - name: Verify DLLs
        run: |
          for dll in libarm64ecfex.dll libwow64fex.dll wowbox64.dll; do
            [ -f "fexcore-dlls/$dll" ] || { echo "::error::$dll missing"; exit 1; }
          done

      - name: Download Proton source (ValveSoftware/wine proton_11.0 branch)
        run: |
          wget -q "https://github.com/ValveSoftware/wine/archive/refs/heads/proton_11.0.tar.gz" -O /tmp/wine.tar.gz
          echo "wine_sha=$(sha256sum /tmp/wine.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Verify wine patches (alphabetical order, patch -p1 — matches Termux builder)
        run: |
          mkdir -p /tmp/wine-source && tar -xzf /tmp/wine.tar.gz -C /tmp/wine-source --strip-components=1
          FAILED=0; PASSED=0
          # Termux builder applies patches in alphabetical order using patch -p1.
          # .beforehostbuild patches are applied first (before host build),
          # then regular .patch files (before cross-configure).
          for patch in $(ls "$GITHUB_WORKSPACE"/patches/*.patch.beforehostbuild "$GITHUB_WORKSPACE"/patches/*.patch 2>/dev/null | sort); do
            if patch --dry-run -p1 -F0 --no-backup-if-mismatch -d /tmp/wine-source < "$patch" >/tmp/p.log 2>&1; then
              patch -p1 -F0 --no-backup-if-mismatch -d /tmp/wine-source < "$patch"
              echo "  OK    $(basename "$patch")"; PASSED=$((PASSED+1))
            else
              echo "  FAIL  $(basename "$patch")"; FAILED=$((FAILED+1))
              cat /tmp/p.log | sed 's/^/        /'
            fi
          done
          echo "$PASSED passed, $FAILED failed"
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

      - name: Clone termux-packages
        run: git clone --depth=1 https://github.com/termux/termux-packages.git

      - name: Install our files
        run: |
          PKG_DIR="termux-packages/x11-packages/proton-termux"
          mkdir -p "$PKG_DIR"
          rm -fv $PKG_DIR/*.patch $PKG_DIR/*.patch.beforehostbuild $PKG_DIR/build.sh 2>/dev/null || true
          cp -v build.sh "$PKG_DIR/build.sh"
          for p in patches/*.patch patches/*.patch.beforehostbuild; do
            [ -f "$p" ] && cp -v "$p" "$PKG_DIR/$(basename "$p")"
          done
          mkdir -p "$PKG_DIR/fex-dlls" && cp -v fexcore-dlls/*.dll "$PKG_DIR/fex-dlls/"
          # Copy android/ dir (needed by FSYNC patches — shm_utils.h include)
          cp -rv android "$PKG_DIR/"

      - name: Inject version + sha256
        run: |
          PKG_DIR="termux-packages/x11-packages/proton-termux"
          sed -i "s|__PROTON_SHA256__|${{ env.wine_sha }}|g" "$PKG_DIR/build.sh"
          bash -n "$PKG_DIR/build.sh"

      - name: Codec toggles
        run: |
          PKG_DIR="termux-packages/x11-packages/proton-termux"
          # build.sh defaults to --with-ffmpeg/--with-gstreamer/--with-gettext.
          # Toggle to --without- only when user explicitly disables.
          [ "${{ github.event.inputs.enable_ffmpeg }}" = "false" ] && sed -i 's/--with-ffmpeg/--without-ffmpeg/' "$PKG_DIR/build.sh"
          [ "${{ github.event.inputs.enable_gstreamer }}" = "false" ] && sed -i 's/--with-gstreamer/--without-gstreamer/' "$PKG_DIR/build.sh"
          [ "${{ github.event.inputs.enable_translations }}" = "false" ] && sed -i 's/^--with-gettext$/--without-gettext/' "$PKG_DIR/build.sh"
          # Add codec deps to TERMUX_PKG_DEPENDS (only when enabled).
          EXTRA=""
          [ "${{ github.event.inputs.enable_gstreamer }}" != "false" ] && EXTRA+=", gstreamer, gst-plugins-base, gst-plugins-good, gst-plugins-bad, gst-plugins-ugly, gst-libav"
          [ "${{ github.event.inputs.enable_ffmpeg }}" != "false" ] && EXTRA+=", ffmpeg"
          EXTRA=$(echo "$EXTRA" | sed 's/^, //')
          [ -n "$EXTRA" ] && sed -i "/^TERMUX_PKG_DEPENDS=/ s/xorg-xrandr/xorg-xrandr, ${EXTRA}/" "$PKG_DIR/build.sh"
          bash -n "$PKG_DIR/build.sh"

      - name: Free disk space
        run: cd termux-packages && export CI=true && ./scripts/free-space.sh && df -h

      - name: Pull builder image
        run: |
          sudo systemctl start docker || true
          sudo docker pull ghcr.io/termux/package-builder:latest
          sudo docker images | grep package-builder

      - name: Verify gettext (msgfmt) inside builder image
        if: github.event.inputs.enable_translations != 'false'
        env:
          TERMUX_DOCKER_IMAGE: ghcr.io/termux/package-builder:latest
        run: |
          sudo docker run --rm "$TERMUX_DOCKER_IMAGE" bash -lc 'command -v msgfmt && msgfmt --version | head -1'

      - name: Build
        env:
          TERMUX_DOCKER_IMAGE: ghcr.io/termux/package-builder:latest
        run: |
          cd termux-packages
          sudo -E ./scripts/run-docker.sh ./build-package.sh -a aarch64 -I x11-packages/proton-termux 2>&1 | tee build.log || {
            tail -200 build.log; exit 1; }

      - name: Collect
        run: mkdir -p artifacts && find termux-packages -name "*.deb" -type f -exec cp {} artifacts/ \; && ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnemuproton-aarch64-11.0
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Release
        if: github.event.inputs.upload_release == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="vnemuproton-11.0-r${{ github.run_number }}"
          echo "VNEmuProton 11.0 (Valve Proton 11.0 for Termux)" > /tmp/notes.md
          gh release create "$TAG" --title "VNEmuProton 11.0" --notes-file /tmp/notes.md --repo "${{ github.repository }}" || true
          # Upload all .deb files (main proton-termux + subpackages: libarm64ecfex, libwow64fex, wowbox64)
          for deb in artifacts/*.deb; do [ -f "$deb" ] && gh release upload "$TAG" "$deb" --repo "${{ github.repository }}" --clobber; done
